// FlareDB I/O example pipelines (formerly example/flare-io/pom.xml).
//
// Depends on the in-tree flaredb-runner project instead of the published
// artifact. ReadPipeline/WritePipeline are currently being fleshed out;
// add the 'application' plugin (and a mainClass) once the entry points land.

plugins {
    id 'java'
}

dependencies {
    implementation project(':flaredb-runner')
    implementation libs.beam.core
    runtimeOnly libs.slf4j.simple
}
