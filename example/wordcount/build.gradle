// WordCount example pipeline (formerly example/wordcount/pom.xml).
//
// Build the pipeline:
//   ./gradlew :wordcount:shadowJar  (build/libs/wordcount-0.2.0-all.jar)
//
// Run:
// By default this runs with sample text (test-data/thirukkural.txt) automatically.
//
//   ./gradlew :wordcount:run
//
// To Point it at any other text file pass the file path as argument --inputFile:
//
//   ./gradlew :wordcount:run --args="--inputFile=/path/to/other.txt"
//

plugins {
    id 'java'
    id 'application'
    alias(libs.plugins.shadow)
}

application {
    mainClass = 'com.flaredb.example.WordCount'
}

dependencies {
    implementation project(':flaredb-runner')
    implementation libs.beam.core
    runtimeOnly libs.slf4j.simple
}

shadowJar {
    mergeServiceFiles()
    zip64 = true // Shaded Beam deps can exceed the 65535-entry zip limit.
}

run {
    // The FlareRunner stages the shadow (uber) JAR to the FlareDB workers, so it must exist
    // before the example starts.
    dependsOn tasks.named('shadowJar')
}
