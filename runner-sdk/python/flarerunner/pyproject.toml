[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flaredb-runner"
version = "0.1.0"
description = "Apache Beam portable runner for submitting Python pipelines to FlareDB"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "apache-beam>=2.76.0",
]

[tool.setuptools.packages.find]
include = ["flaredb_runner*"]
