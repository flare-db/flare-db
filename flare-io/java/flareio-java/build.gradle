// FlareDB I/O for Apache Beam.

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.spotless)
}

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    implementation libs.beam.core
    implementation libs.beam.arrow
    implementation libs.arrow.flight.core
    implementation libs.arrow.flight.sql
    implementation libs.arrow.vector
    implementation libs.arrow.memory.core
    implementation libs.arrow.memory.netty

    // AutoValue generates the AutoValue_FlareDbIO_* implementations.
    compileOnly libs.auto.value.annotations
    annotationProcessor libs.auto.value

    implementation libs.slf4j.api
    implementation libs.joda.time
    implementation libs.checker.qual

    testImplementation libs.junit
}

spotless {
    java {
        googleJavaFormat('1.27.0')
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'FlareDB I/O'
                description = 'Apache Beam I/O for FlareDB'
                url = 'https://github.com/flare-db/flare-db'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        name = 'Ganesh Sivakumar'
                        email = 'ganesh.gsivakumar@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/flare-db/flare-db.git'
                    developerConnection = 'scm:git:ssh://git@github.com:flare-db/flare-db.git'
                    url = 'https://github.com/flare-db/flare-db'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'sonatype'
            url = 'https://central.sonatype.com/api/v1/publisher'
            credentials(PasswordCredentials)
        }
    }
}

signing {
    // Only require a signatory when publishing to a remote repository
    // (Sonatype Central). Local publishes via publishToMavenLocal skip
    // signing so no GPG key setup is needed for development/testing.
    setRequired {
        gradle.taskGraph.allTasks.any { it.name.contains('SonatypeRepository') }
    }
    sign publishing.publications.mavenJava
}
